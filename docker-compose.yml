# Brightloop Subscriptions: local development stack.
# Start everything with:  docker compose up --build
# Every variable has a default, so a .env file is optional (see .env.example).
name: brightloop

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brightloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop}
      POSTGRES_DB: ${POSTGRES_DB:-brightloop}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Localhost only. 5433 avoids clashing with a Postgres installed on the machine.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-brightloop}:${POSTGRES_PASSWORD:-brightloop}@db:5432/${POSTGRES_DB:-brightloop}
      # File change events from Windows don't reach Linux containers, so the reloader polls.
      WATCHFILES_FORCE_POLLING: "true"
      # Empty means "use the built-in development secret". Set a real one in .env for
      # anything other than local development.
      JWT_SECRET: ${JWT_SECRET:-}
    # Apply new migrations, create the demo users if missing, then start the API with auto-reload.
    command: sh -c "alembic upgrade head && python /scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      WATCH_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      # Only source folders are mounted. node_modules and config files come from
      # the image, so rebuild (docker compose up --build) after changing them.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api

volumes:
  db_data:
